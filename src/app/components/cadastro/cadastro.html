<div id="div-form">
  <h2>Cadastro de Atleta</h2>

  <form id="formulario" (submit)="saveAtleta()">

    <div class="form-group full-width">
      <label for="nome">Nome Completo</label>
      <input
        type="text"
        name="nome"
        id="nome"
        placeholder="Digitar seu nome completo"
        [(ngModel)]="nome"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cpf">CPF</label>
        <input
          type="text"
          name="cpf"
          id="cpf"
          placeholder="000.000.000-00"
          maxlength="14"
          [(ngModel)]="cpf"
        />
      </div>
      <div class="form-group">
        <label for="sexo">Sexo</label>
        <select name="sexo" id="sexo" [(ngModel)]="sexo">
          <option value="">Selecione</option>
          <option value="masculino">Masculino</option>
          <option value="feminino">Feminino</option>
          <option value="outro">Prefiro não informar</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="cep">CEP</label>
        <input
          type="text"
          name="cep"
          id="cep"
          placeholder="00000-000"
          maxlength="9"
          [(ngModel)]="cep"
        />
      </div>
      <div class="form-group">
        <label for="rua">Rua / Logradouro</label>
        <input
          type="text"
          name="rua"
          id="rua"
          placeholder="Rua Vila e Dão de Junco"
          [(ngModel)]="rua"
        />
      </div>
    </div>

    <div class="form-row three-columns">
      <div class="form-group">
        <label for="bairro">Bairro</label>
        <input
          type="text"
          name="bairro"
          id="bairro"
          placeholder="São Completás"
          [(ngModel)]="bairro"
        />
      </div>
      <div class="form-group">
        <label for="cidade">Cidade</label>
        <input type="text" name="cidade" id="cidade" placeholder="Araçu" [(ngModel)]="cidade" />
      </div>
      <div class="form-group">
        <label for="uf">UF</label>
        <input type="text" name="uf" id="uf" placeholder="SE" maxlength="2" [(ngModel)]="uf" />
      </div>
    </div>

 
    <div id="btns">
      <button type="submit" id="btnAdd">Cadastrar Atleta</button>
      <button type="reset" id="btnLimpa">Limpar Dados</button>
    </div>
  </form>
</div>
