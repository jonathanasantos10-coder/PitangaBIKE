<div id="div-form">
  <h2>Cadastro de Atleta</h2>
  <form id="formulario" (submit)="saveAtleta()">
    <div class="campo">
      <label for="nome">Nome completo</label>
      <input type="text" name="nome" id="nome" [(ngModel)]="nome" />
    </div>

    <div class="linha">
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" name="cpf" id="cpf" maxlength="11" [(ngModel)]="cpf" />
      </div>

      <div class="campo">
        <label for="sexo">Sexo</label>
        <select name="sexo" id="sexo" [(ngModel)]="sexo">
          <option>Masculino</option>
          <option>Feminino</option>
          <option selected>Prefiro não informar</option>
        </select>
      </div>
    </div>

    <div class="linha">
      <div class="campo cep">
        <label for="cep">CEP</label>
        <input type="text" name="cep" id="cep" [(ngModel)]="cep" />
      </div>

      <div class="campo rua">
        <label for="rua">Rua / Logradouro</label>
        <input type="text" name="rua" id="rua" [(ngModel)]="rua" />
      </div>
    </div>

    <div class="linha">
      <div class="campo">
        <label for="bairro">Bairro</label>
        <input type="text" name="bairro" id="bairro" [(ngModel)]="bairro" />
      </div>

      <div class="campo">
        <label for="cidade">Cidade</label>
        <input type="text" name="cidade" id="cidade" [(ngModel)]="cidade" />
      </div>

      <div class="campo uf">
        <label for="uf">UF</label>
        <input type="text" name="uf" id="uf" maxlength="2" [(ngModel)]="uf" />
      </div>
    </div>

    <div id="btns">
      <button type="submit" id="btnAdd">Cadastrar Atleta</button>
      <button type="reset" id="btnLimpa">Limpar Dados</button>
    </div>
  </form>
</div>
