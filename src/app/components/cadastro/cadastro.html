<div id="div-form">
    <h2>Cadastro de Atleta</h2>

    <form id="formulario">
        <label for="nome"> Nome completo </label>
        <input type="text" name="nome" id="nome"  />

        <label for="cpf"> CPF </label>
        <input type="number" name="cpf" id="cpf"  maxlength="9" />

        <label for="sexo"></label>
        <select name="sexo" name="sexo" id="sexo">
            <option> Masculino</option>
            <option> Feminino </option>
            <option selected> Prefiro não informar </option>
        </select>

        <label for="cep"> CEP </label>
        <input type="number" name="cep" id="cep" />


        <div class="hidden">
            <label for="rua"> Rua / Logradouro </label>
            <input type="text" name="rua" id="rua">

            <label for="bairro"></label>
            <input type="text" name="bairro" id="bairro">

            <label for="cidade"></label>
            <input type="text" name="cidade" id="cidade">

            <label for="uf"></label>
            <input type="text" name="uf" id="uf">

        </div>

        <div id="btns">
            <button type="submit" id="btnAdd"> Cadastrar Atleta </button>
            <button type="reset" id="btnLimpa"> Limpar Dados </button>
        </div>
    </form>

    <div id="div-btns">
       
    </div>

</div>
