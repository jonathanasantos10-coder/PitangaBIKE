<div id="div-form">
    <h2>Cadastro de Atleta</h2>

    <form id="formulario" (submit)="saveAtleta()">
        <label for="nome"> Nome completo </label>
        <input type="text" name="nome" id="nome" [(ngModel)]="nome">

        <label for="cpf"> CPF </label>
        <input type="string" name="cpf" id="cpf" maxlength="9" [(ngModel)]="cpf">

        <label for="sexo"></label>
        <select name="sexo" id="sexo" [(ngModel)]="sexo">
            <option> Masculino</option>
            <option> Feminino </option>
            <option selected> Prefiro não informar </option>
        </select>

        <label for="cep"> CEP </label>
        <input type="number" name="cep" id="cep" [(ngModel)]="cep">

        <label for="rua"> Rua / Logradouro </label>
        <input type="text" name="rua" id="rua" [(ngModel)]="rua" >

        <label for="bairro"></label>
        <input type="text" name="bairro" id="bairro" [(ngModel)]="bairro">

        <label for="cidade"></label>
        <input type="text" name="cidade" id="cidade" [(ngModel)]="cidade">

        <label for="uf"></label>
        <input type="text" name="uf" id="uf" [(ngModel)]="uf">

        <div id="btns">
            <button type="submit" id="btnAdd"> Cadastrar Atleta </button>
            <button type="reset" id="btnLimpa"> Limpar Dados </button>
        </div>

    </form>

</div>
