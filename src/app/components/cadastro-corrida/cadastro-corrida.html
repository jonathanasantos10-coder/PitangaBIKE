<div id="div-form">
  <h2>Cadastro de Corridas</h2>

  <form id="formulario" (submit)="saveCorrida()">

    <div class="f">
      <label for="descricao">Descrição da Corrida</label>
      <textarea
        id="descricao"
        name="descricao"
        [(ngModel)]="descricao"
        placeholder="Ex: Primeira corrida de ataque de tempo no Morro do Urubu, prêmio, idade mínima, etc."
      ></textarea>
    </div>

  
    <div class="campo">
      <label for="data">Data da Corrida</label>
      <input type="date" name="data" id="data" [(ngModel)]="data" />
    </div>

  
    <div class="campo">
      <label>Distância da Corrida</label>
      <div class="opcoes">
        <label>
          <input type="radio" name="distancia" value="5" [(ngModel)]="distancia" />
          5 KM
        </label>

        <label>
          <input type="radio" name="distancia" value="10" [(ngModel)]="distancia" />
          10 KM
        </label>

        <label>
          <input type="radio" name="distancia" value="25" [(ngModel)]="distancia" />
          25 KM
        </label>
      </div>
    </div>

   
    <div id="btns">
      <button type="submit" id="btnAdd">Cadastrar Corrida</button>
      <button type="reset" id="btnLimpa">Limpar Dados</button>
    </div>
  </form>
</div>
